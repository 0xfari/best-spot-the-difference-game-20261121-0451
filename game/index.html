<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Bakery — Spot the Difference</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header id="hud">
    <div class="title-block">
      <h1>THE MIDNIGHT BAKERY</h1>
      <p id="scene-name">Scene 1 · The Bakery Counter</p>
    </div>
    <div class="stat"><span class="label">FOUND</span><span id="found-count">0 / 6</span></div>
    <div class="stat"><span class="label">TIME</span><span id="timer">90</span></div>
    <div class="stat"><span class="label">SCORE</span><span id="score">0</span></div>
    <div class="stat"><span class="label">STREAK</span><span id="streak">×1</span></div>
    <button id="hint-btn" type="button">HINT (H) · 3</button>
    <button id="mute-btn" type="button" aria-label="Mute">SOUND ON</button>
  </header>
  <main id="boards">
    <section class="panel">
      <h2>LEFT — the original</h2>
      <canvas id="left-canvas" width="600" height="580"></canvas>
    </section>
    <section class="panel">
      <h2>RIGHT — spot what's different</h2>
      <canvas id="right-canvas" width="600" height="580"></canvas>
    </section>
  </main>
  <footer id="bar">
    <div id="dots" aria-label="Scene progress"></div>
    <p id="message">Click a difference on either picture. Find all 6 before the clock runs out.</p>
  </footer>
  <div id="overlay" class="hidden">
    <div id="overlay-card">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <button id="overlay-btn" type="button"></button>
    </div>
  </div>
</div>
<script type="module" src="boot.js"></script>
</body>
</html>
